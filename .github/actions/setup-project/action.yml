name: Setup project
description: Set up Bun and install the locked dependencies. Assumes the repo has already been checked out.

runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: '1.4.0'

    - name: Install dependencies
      run: bun ci
      shell: bash
